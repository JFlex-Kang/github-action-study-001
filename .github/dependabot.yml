version: 2                              # 설정 파일의 자체 버전
updates:                                # 의존성 업데이트 설정
  - package-ecosystem: github-actions   # 패키지 에코시스템 (깃허브 액션 자동 업데이트)
    directory: /                        # 패키지 매니페스트 배치 위치
    schedule:                           # 업데이트 스케줄
      interval: daily                   # (daily, weekly, monthly)
    ignore:                                         # 업데이트 예외 설정
      - dependency-name: actions/upload-artifact    # 제외할 의존성 이름
        versions:                                   # 제외 대상 버전
          - 4.3.0
          - 4.3.1
      - dependency-name: 'actions/*'                # 별표는 임의의 문자열과 매치
        update-types:                               # 제외할 업데이트 종류
          - version-update:semver-major