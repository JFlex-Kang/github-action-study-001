name: Dependabot Auto Patch Merge
on: pull_request
jobs:
    merge:
        if: ${{github.actor == 'dependabot[bot]'}}      # Dependabot 풀 리퀘스트만 대상
        runs-on: ubuntu-latest
        permissions:                                    # 머지에 필요한 권한
            contents: write
            pull-requests: write
        env:
            GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}     # 깃허브 CLI 인증 정보
        steps:
            - uses: actions/checkout@v4
            - id: meta                                  # 의존성 메타데이터 가져오기
              uses: dependabot/fetch-metadata@v2        # 조건 분기로 버전 업데이트인지 확인하기
            - if: ${{steps.meta.outputs.update-type == 'version-update:semver-patch'}}      # 의존성의 패치 버전 업데이트 시에만 풀 리퀘스트 리뷰 승인 및 자동 머지
              run: |
                gh pr review "${GITHUB_HEAD_REF}" --approve        # 깃허브 CLI 통해 리뷰 승인
                gh pr merge "${GITHUB_HEAD_REF}" --merge --auto    # 깃허브 CLI 통해 PR 머지
