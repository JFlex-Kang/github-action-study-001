name: GITHUB_OUTPUT
run-name: Test GITHUB_OUTPUT by @${{github.actor}}                # 워크플로 실행명 지정
on: push
jobs:
    share:
        runs-on: ubuntu-latest
        steps:
            - id: source                                          # 스텝 ID 설정
              run: echo "result=Hello" >> "${GITHUB_OUTPUT}"      # GITHUB_OUTPUT에 기록
            - env:
                RESULT: ${{steps.source.outputs.result}}          # steps 컨텍스트 통해 참조
              run: echo "${RESULT}"
