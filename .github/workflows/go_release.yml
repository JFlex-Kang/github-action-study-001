name: Release
on:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'
jobs:
    release:
        runs-on: ubuntu-latest
        env:
            VERSION: ${{github.ref_name}}               # v1.2.3 형식의 값을 깃 태그에서 가져오기
        permissions:
            contents: write                             # 릴리스 노트 작성에 필요한 권한
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                go-version: '1.22'
            - run: |                                    # 릴리스 대상 애플리케이션 빌드
                go build -ldflags "-X main.version=${VERSION}" \
                  -o "${RUNNER_TEMP}/example" go/ex2/main.go
            - run: |                                    # 릴리스 노트 작성과 애셋 업로드
                gh release create "${VERSION}" --TITLE "${VERSION}" --generate-notes
                gh release upload "${VERSION}" "${RUNNER_TEMP}/example"
              env:
                GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
